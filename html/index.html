{% extends "base.html" %}

{% block title %}Netscope — GeoIP &amp; Network Lookup{% endblock %}

{% block content %}
<div class="page page--narrow">

    <div class="brand">
        <div class="brand-title">Netscope</div>
        <div class="brand-sub">MaxMind GeoLite2 — offline database</div>
    </div>

    <div class="card">
        <div class="card-header">
            <span class="card-title">Search</span>
        </div>
        <div class="search-tabs" role="tablist">
            <button class="search-tab active" data-type="ip"            role="tab" onclick="setTab('ip')">IP</button>
            <button class="search-tab"        data-type="asn"           role="tab" onclick="setTab('asn')">ASN</button>
            <button class="search-tab"        data-type="cidr"          role="tab" onclick="setTab('cidr')">CIDR</button>
            <button class="search-tab"        data-type="country"       role="tab" onclick="setTab('country')">Country</button>
            <button class="search-tab"        data-type="multi-country" role="tab" onclick="setTab('multi-country')">Multi-Country</button>
            <button class="search-tab"        data-type="org"           role="tab" onclick="setTab('org')">Org</button>
        </div>
        <form class="input-row" onsubmit="goSearch(event)">
            <input id="main-search" type="text" autocomplete="off" spellcheck="false">
            <button type="submit">Go</button>
        </form>
        <p class="search-hint" id="search-hint"></p>
    </div>

    <div class="quick-links">
        <a href="/myip">/myip</a>
        <a href="/country/US">/country/…</a>
        <a href="/multi-country">/multi-country</a>
        <a href="/health">/health</a>
    </div>

</div>
{% endblock %}
