<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Country ASN Search — GeoIP</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f5f5f3;
            --page: #ffffff;
            --border: #e4e4e0;
            --label: #8a8a85;
            --value: #1a1a18;
            --muted: #b0b0aa;
            --section-bg: #fafaf8;
            --accent: #2563eb;
            --accent-bg: #eff6ff;
            --mono: ui-monospace, 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: var(--bg);
            font-family: var(--sans);
            font-size: 14px;
            color: var(--value);
            min-height: 100vh;
            padding: 2rem 1rem 4rem;
        }

        .page { max-width: 820px; margin: 0 auto; }

        .header { margin-bottom: 1.5rem; }

        .header-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.4rem;
        }

        .header-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--value);
            letter-spacing: -0.02em;
        }

        .header-sub {
            margin-top: 0.35rem;
            font-size: 13px;
            color: var(--muted);
        }

        .search-bar {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
        }

        input[type="text"] {
            flex: 1;
            font-family: var(--mono);
            font-size: 14px;
            padding: 0.6rem 0.85rem;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: var(--page);
            color: var(--value);
            outline: none;
        }

        input[type="text"]:focus { border-color: var(--accent); }

        button {
            font-family: var(--sans);
            font-size: 13px;
            font-weight: 600;
            padding: 0.6rem 1.1rem;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        button:hover { background: #1d4ed8; }

        .result-meta {
            font-size: 12.5px;
            color: var(--muted);
            margin-bottom: 0.75rem;
        }

        .result-meta strong { color: var(--value); }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--page);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        .results-table thead tr { background: var(--section-bg); }

        .results-table th {
            padding: 0.65rem 1.25rem;
            text-align: left;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--label);
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }

        .results-table th:hover { color: var(--accent); }

        .results-table th[aria-sort]::after {
            content: " ▲";
            font-size: 9px;
            opacity: 0.7;
        }

        .results-table th[aria-sort="descending"]::after { content: " ▼"; }

        .results-table td {
            padding: 0.6rem 1.25rem;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            vertical-align: top;
        }

        .results-table tbody tr:last-child td { border-bottom: none; }
        .results-table tbody tr:hover { background: var(--section-bg); }

        .asn-link {
            font-family: var(--mono);
            font-size: 12.5px;
            color: var(--accent);
            font-weight: 700;
            text-decoration: none;
        }

        .asn-link:hover { text-decoration: underline; }

        .country-tag {
            display: inline-block;
            font-family: var(--mono);
            font-size: 11.5px;
            padding: 0.15rem 0.45rem;
            border-radius: 4px;
            margin: 0.1rem 0.15rem 0.1rem 0;
            text-decoration: none;
            background: var(--accent-bg);
            color: var(--accent);
            font-weight: 600;
        }

        .country-tag:hover { text-decoration: underline; }

        .country-tag.matched {
            background: #dcfce7;
            color: #166534;
        }

        .count-badge {
            display: inline-block;
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 600;
            background: var(--accent-bg);
            color: var(--accent);
            padding: 0.1rem 0.45rem;
            border-radius: 4px;
        }

        .no-results {
            padding: 2rem 1.25rem;
            color: var(--muted);
            font-style: italic;
            background: var(--page);
            border: 1px solid var(--border);
            border-radius: 10px;
            text-align: center;
        }

        @media (max-width: 500px) {
            .search-bar { flex-direction: column; }
            .results-table th:nth-child(2),
            .results-table td:nth-child(2) { display: none; }
        }
    </style>
</head>
<body>
<div class="page">

    <div class="header">
        <div class="header-label"><a href="/" style="color:inherit;text-decoration:none">GeoIP</a></div>
        <div class="header-title">Multi-Country ASN Search</div>
        <div class="header-sub">Find ASes that span two or more countries — enter ISO codes separated by commas</div>
    </div>

    <form class="search-bar" action="/multi-country" method="get">
        <input type="text" name="q" value="$query" placeholder="e.g. GB, IR  or  US, DE, FR" autofocus autocomplete="off" spellcheck="false">
        <button type="submit">Search</button>
    </form>

    $result_meta_html

    $results_html

</div>
<script>
document.addEventListener('click', function(e) {
    const th = e.target.closest('th[data-col]');
    if (!th) return;
    const table = th.closest('table');
    const tbody = table.querySelector('tbody');
    const col = +th.dataset.col;
    const isNum = th.dataset.type === 'num';
    const asc = th.getAttribute('aria-sort') !== 'ascending';

    table.querySelectorAll('th').forEach(h => h.removeAttribute('aria-sort'));
    th.setAttribute('aria-sort', asc ? 'ascending' : 'descending');

    const rows = Array.from(tbody.querySelectorAll('tr'));
    rows.sort((a, b) => {
        const av = a.cells[col].dataset.val ?? a.cells[col].textContent.trim();
        const bv = b.cells[col].dataset.val ?? b.cells[col].textContent.trim();
        const cmp = isNum ? (+av - +bv) : av.localeCompare(bv);
        return asc ? cmp : -cmp;
    });
    rows.forEach(r => tbody.appendChild(r));
});
</script>
</body>
</html>
