<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search — GeoIP</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f5f5f3;
            --page: #ffffff;
            --border: #e4e4e0;
            --label: #8a8a85;
            --value: #1a1a18;
            --muted: #b0b0aa;
            --section-bg: #fafaf8;
            --accent: #2563eb;
            --accent-bg: #eff6ff;
            --mono: ui-monospace, 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: var(--bg);
            font-family: var(--sans);
            font-size: 14px;
            color: var(--value);
            min-height: 100vh;
            padding: 2rem 1rem 4rem;
        }

        .page { max-width: 720px; margin: 0 auto; }

        .header { margin-bottom: 1.5rem; }

        .header-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.4rem;
        }

        .header-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--value);
            letter-spacing: -0.02em;
        }

        /* Search bar */
        .search-bar {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
        }

        input[type="text"] {
            flex: 1;
            font-family: var(--sans);
            font-size: 14px;
            padding: 0.6rem 0.85rem;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: var(--page);
            color: var(--value);
            outline: none;
        }

        input[type="text"]:focus { border-color: var(--accent); }

        button {
            font-family: var(--sans);
            font-size: 13px;
            font-weight: 600;
            padding: 0.6rem 1.1rem;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        button:hover { background: #1d4ed8; }

        /* Count badge */
        .result-meta {
            font-size: 12.5px;
            color: var(--muted);
            margin-bottom: 0.75rem;
        }

        .result-meta strong { color: var(--value); }

        /* Results table */
        .results-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--page);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        .results-table thead tr {
            background: var(--section-bg);
        }

        .results-table th {
            padding: 0.65rem 1.25rem;
            text-align: left;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--label);
            border-bottom: 1px solid var(--border);
        }

        .results-table td {
            padding: 0.6rem 1.25rem;
            border-bottom: 1px solid var(--border);
            font-size: 13.5px;
        }

        .results-table tbody tr:last-child td { border-bottom: none; }
        .results-table tbody tr:hover { background: var(--section-bg); }

        .asn-link {
            font-family: var(--mono);
            font-size: 12.5px;
            color: var(--accent);
            font-weight: 700;
            text-decoration: none;
        }

        .asn-link:hover { text-decoration: underline; }

        .no-results {
            padding: 2rem 1.25rem;
            color: var(--muted);
            font-style: italic;
            background: var(--page);
            border: 1px solid var(--border);
            border-radius: 10px;
            text-align: center;
        }

        @media (max-width: 500px) {
            .search-bar { flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="page">

    <div class="header">
        <div class="header-label"><a href="/" style="color:inherit;text-decoration:none">GeoIP</a></div>
        <div class="header-title">Organization Search</div>
    </div>

    <form class="search-bar" action="/search" method="get">
        <input type="text" name="q" value="$query" placeholder="Search organization name…" autofocus>
        <button type="submit">Search</button>
    </form>

    <div class="result-meta">
        $result_count result(s) for <strong>&ldquo;$query&rdquo;</strong>
    </div>

    $results_html

</div>
</body>
</html>
