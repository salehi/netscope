<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$country_name ($iso) — Country Prefixes</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f5f5f3;
            --page: #ffffff;
            --border: #e4e4e0;
            --label: #8a8a85;
            --value: #1a1a18;
            --muted: #b0b0aa;
            --section-bg: #fafaf8;
            --accent: #2563eb;
            --accent-bg: #eff6ff;
            --tag-bg: #f0f0ec;
            --tag-text: #5a5a55;
            --mono: ui-monospace, 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: var(--bg);
            font-family: var(--sans);
            font-size: 14px;
            color: var(--value);
            min-height: 100vh;
            padding: 2rem 1rem 4rem;
        }

        .page { max-width: 720px; margin: 0 auto; }

        .header { margin-bottom: 2rem; }

        .header-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.4rem;
        }

        .header-country {
            font-size: 2rem;
            font-weight: 700;
            color: var(--value);
            letter-spacing: -0.02em;
            line-height: 1.1;
        }

        .header-iso {
            display: inline-block;
            font-family: var(--mono);
            font-size: 13px;
            font-weight: 600;
            padding: 0.1rem 0.45rem;
            border-radius: 4px;
            background: var(--tag-bg);
            color: var(--tag-text);
            margin-left: 0.5rem;
            vertical-align: middle;
        }

        .card {
            background: var(--page);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.75rem 1.25rem;
            background: var(--section-bg);
            border-bottom: 1px solid var(--border);
        }

        .card-header svg { opacity: 0.4; flex-shrink: 0; }

        .card-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--label);
        }

        .card-count {
            margin-left: auto;
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 600;
            background: var(--accent-bg);
            color: var(--accent);
            padding: 0.1rem 0.45rem;
            border-radius: 4px;
        }

        .row {
            display: grid;
            grid-template-columns: 155px 1fr;
            align-items: baseline;
            padding: 0.65rem 1.25rem;
            border-bottom: 1px solid var(--border);
            gap: 1rem;
        }

        .row:last-child { border-bottom: none; }

        .row-label {
            font-size: 12px;
            color: var(--label);
            font-weight: 500;
        }

        .row-value {
            font-size: 14px;
            color: var(--value);
            font-weight: 500;
        }

        .network-list {
            list-style: none;
            padding: 0.5rem 1.25rem;
        }

        .network-list li.entry {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding: 0.35rem 0;
            border-bottom: 1px solid var(--border);
        }

        .network-list li.entry:last-child { border-bottom: none; }

        .network-list li.v6 .prefix { color: var(--label); }

        .network-list a { text-decoration: none; }
        .network-list a:hover { text-decoration: underline; color: var(--accent); }

        .network-list .prefix {
            font-family: var(--mono);
            font-size: 12.5px;
            color: var(--value);
            min-width: 160px;
        }

        .network-list .asn-tag {
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 600;
            color: var(--accent);
            background: var(--accent-bg);
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            white-space: nowrap;
        }

        .network-list .org-tag {
            font-size: 12px;
            color: var(--label);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .api-footer {
            margin-top: 1.5rem;
            padding: 0.9rem 1.25rem;
            background: var(--page);
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        .api-footer-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.55rem;
        }

        .api-links { display: flex; flex-wrap: wrap; gap: 0.35rem; }

        .api-links a {
            font-family: var(--mono);
            font-size: 11.5px;
            color: var(--accent);
            text-decoration: none;
            background: var(--accent-bg);
            padding: 0.2rem 0.55rem;
            border-radius: 5px;
            font-weight: 500;
        }

        .api-links a:hover { text-decoration: underline; }

        @media (max-width: 500px) {
            .row { grid-template-columns: 1fr; gap: 0.1rem; }
            .header-country { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
<div class="page">

    <div class="header">
        <div class="header-label"><a href="/" style="color:inherit;text-decoration:none">GeoIP</a></div>
        <div class="header-country">
            $country_name
            <span class="header-iso">$iso</span>
        </div>
    </div>

    <!-- Summary -->
    <div class="card">
        <div class="card-header">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"/>
            </svg>
            <span class="card-title">Country Info</span>
        </div>
        <div class="row">
            <span class="row-label">Country</span>
            <span class="row-value">$country_name</span>
        </div>
        <div class="row">
            <span class="row-label">ISO Code</span>
            <span class="row-value" style="font-family:var(--mono)">$iso</span>
        </div>
        <div class="row">
            <span class="row-label">Total Prefixes</span>
            <span class="row-value">$network_count</span>
        </div>
    </div>

    <!-- Network prefixes -->
    <div class="card">
        <div class="card-header">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/>
            </svg>
            <span class="card-title">Network Prefixes</span>
            <span class="card-count">$network_count</span>
        </div>
        <ul class="network-list">
$networks_html
        </ul>
    </div>

    <div class="api-footer">
        <div class="api-footer-label">API Endpoints</div>
        <div class="api-links">
            <a href="/country/$iso">/country/$iso</a>
        </div>
    </div>

</div>
</body>
</html>
